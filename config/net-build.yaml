# Build-phase egress policy. Used ONLY by the throwaway `seu build` sandbox,
# never by a session. Everything reachable here is downloaded into the named
# volumes so the locked-down session can work offline.
#
# Open egress: what the build needs depends on the project -- the tools in its
# mise.toml, its Maven repositories, its images -- so an allowlist would always
# be one project behind. The sandbox is destroyed afterwards.
#
# TLS interception stays OFF: it would require importing the microsandbox CA
# into the JDK truststore, because the JVM ignores the OS trust store and Maven
# would fail every HTTPS fetch.
policy: open
strict: false
