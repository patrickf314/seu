# Example project profile for the website-react / tsv-neubiberg repository.
# Copy to <project>/.seu/config.conf.
#
# Format: `key = value`, one pair per line, `#` starts a full-line comment.
# A repeated key builds a list. seu PARSES this file -- it never sources or
# evaluates it, because the repository it sandboxes is not trusted.

# Base image name. Two projects must not share one, or they invalidate each
# other's cached image. Default: seu-vm-<worktree-name>.
image_name  = seu-vm-website-react

# mise config copied into the image, so the in-VM toolchain matches what the
# project's own build validates. Relative to the project root, optional.
mise_config = mise.toml

# Artifact-repository servers this project authenticates against. `seu build`
# reads the credentials for exactly these ids from ~/.m2/settings.xml (falling
# back to GITHUB_ACTOR/GITHUB_TOKEN) and passes them to the build sandbox's
# environment only. They are never written to disk, and a session never has them.
maven_server = devx-repository
maven_server = ui-test-components-repository
maven_server = tsv-neubiberg-repository

# Docker images the VM must have before the network is taken away. Any of these
# the host already has are `docker save`d into the build sandbox instead of being
# pulled. Keep in sync with common/docker-compose.yml, test/docker-compose.yml
# and common/test-commons/.../container/*.java.
prepull = postgres:18
prepull = axllent/mailpit:v1.27
prepull = nextcloud:31.0.7
prepull = openobserve/openobserve:v1.0.0-rc3
prepull = nginx:latest
prepull = httpd:2.4.68-alpine
prepull = nickfedor/watchtower:latest

# Artifacts to resolve properly during the warm-up, as groupId:artifactId:version.
#
# Two things end up here. Plugins invoked from the COMMAND LINE rather than bound
# in the POM -- `mvn failsafe:integration-test`, reported as `default-cli` -- are
# invisible to go-offline and resolve-plugins, as is everything they need. And
# artifacts nothing declares at all: surefire and failsafe pick their provider
# jar from the test framework they detect, so no goal ever asks for it.
#
# dependency:get resolves descriptors, parent POMs and transitives -- which is
# why naming a coordinate beats copying files: plexus-java's parents
# (plexus-languages, plexus) sit under different artifactId directories, and a
# copy that misses them gives "Failed to read artifact descriptor".
# The version MUST match what the build uses -- dependency:get will happily
# resolve a stale one while the build asks for another.
warm_artifact = org.apache.maven.plugins:maven-failsafe-plugin:3.5.6
warm_artifact = org.apache.maven.surefire:surefire-junit-platform:3.5.6

# Playwright. playwright_pom names the module whose pom puts the Playwright
# client on the classpath; setting it is what enables the browser download, and
# it is required as soon as playwright_browser is used. A project without
# Playwright just omits both keys.
#
# Browser binaries are per-platform: the copies in your ~/Library/Caches are
# macOS builds and the guest is linux-arm64, so there is nothing to reuse -- they
# are downloaded during `seu build` into ~/.cache/ms-playwright, which persists.
# This list is the ONLY source of browsers. Playwright.create() would otherwise
# run a bare `install`, which fetches all three regardless of what the test
# launches -- seu sets PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 to stop that, so a
# browser missing here is missing in the session and fails at launch with
# "Executable doesn't exist". Default is chromium alone.
playwright_pom     = club/club-ui/club-ui-test/pom.xml
playwright_browser = chromium
playwright_browser = firefox
